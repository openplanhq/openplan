# The required values with placeholder names, so CI can lint and render the
# chart. Nothing here is a real Secret or host; an install needs its own.
temporal:
  address: temporal:7233
postgres:
  urlSecret: {name: openplan-postgres, key: url}
valkey:
  api:
    urlSecret: {name: openplan-valkey, key: api-url}
  executor:
    urlSecret: {name: openplan-valkey, key: executor-url}
s3:
  bucket: openplan-artifacts
  region: us-east-1
  accessKeyIDSecret: {name: openplan-s3, key: access-key-id}
  secretAccessKeySecret: {name: openplan-s3, key: secret-access-key}
oidc:
  issuerURL: https://dex.example.com/dex
  clientID: openplan
  clientSecretSecret: {name: openplan-oidc, key: client-secret}
api:
  rootSubject: placeholder-subject
  sessionEncryptionKeySecret: {name: openplan-keys, key: session}
  credentialEncryptionKeySecret: {name: openplan-keys, key: credential}
ingress:
  host: openplan.example.com
  tlsSecretName: openplan-tls
