{{- $component := dict "context" $ "component" "web" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openplan.fullname" . }}-web
  labels:
    {{- include "openplan.labels" $component | nindent 4 }}
data:
  # Replaces the image's deploy/web/nginx.conf, which resolves the api through
  # Docker's embedded DNS and can't work in a pod. A literal upstream is safe
  # here: the api Service's name resolves as soon as the release exists, with
  # or without an api pod behind it.
  default.conf: |
    server {
        listen 5173;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /v1 {
            proxy_pass http://{{ include "openplan.fullname" . }}-api:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /healthz {
            proxy_pass http://{{ include "openplan.fullname" . }}-api:8081;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
