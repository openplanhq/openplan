{{- $component := dict "context" $ "component" "web" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openplan.fullname" . }}-web
  labels:
    {{- include "openplan.labels" $component | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openplan.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openplan.labels" $component | nindent 8 }}
      annotations:
        # nginx reads its config only at start, so a config change rolls the pod.
        checksum/config: {{ include (print $.Template.BasePath "/web-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: web
          image: {{ include "openplan.image" $component }}
          ports:
            - name: http
              containerPort: 5173
          # / and not /healthz: /healthz is proxied to the api, and the web
          # server is healthy whether or not the api is.
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "openplan.fullname" . }}-web
