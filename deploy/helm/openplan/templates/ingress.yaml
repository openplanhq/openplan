{{- $component := dict "context" $ "component" "web" -}}
{{- $host := required "ingress.host is required: the host openplan is served on" .Values.ingress.host -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openplan.fullname" . }}
  labels:
    {{- include "openplan.labels" $component | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ required "ingress.tlsSecretName is required: production mode refuses plain HTTP" .Values.ingress.tlsSecretName }}
  # Everything goes to the web server, which proxies /v1 to the api as it does
  # under Compose, so the api has no route of its own.
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "openplan.fullname" . }}-web
                port:
                  name: http
