{{- $component := dict "context" $ "component" "web" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openplan.fullname" . }}-web
  labels:
    {{- include "openplan.labels" $component | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "openplan.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: 5173
      targetPort: http
