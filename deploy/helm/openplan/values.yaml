# Every key here is contract: it is kept across releases. Settings that are not
# here are fixed by the chart or come from the components' Secrets.

image:
  # Where the openplan-api, openplan-executor and openplan-web images are
  # pulled from. Point it at a mirror in an egress-restricted network.
  registry: ghcr.io/openplanhq
  # Empty means the chart's appVersion, so a chart release runs the images it
  # was released with.
  tag: ""

api:
  # Required. The name of an existing Secret in the release namespace. Every
  # key becomes an environment variable of the api under the same name
  # (DATABASE_URL, VALKEY_URL, OIDC_CLIENT_SECRET, ...). The chart sets
  # HTTP_ADDRESS, OPENPLAN_ENVIRONMENT and OPENPLAN_PUBLIC_URL itself, and those
  # win over the same keys in the Secret.
  existingSecret: ""
  # Optional. The name of an existing Secret whose ca.crt the api trusts in
  # addition to the public roots, for an OIDC issuer behind an internal CA.
  trustedCASecret: ""

executor:
  # Required. The name of an existing Secret in the release namespace. Every
  # key becomes an environment variable of the executor under the same name
  # (TEMPORAL_ADDRESS, VALKEY_URL as the append-only executor user, S3_*, ...).
  # Keep it apart from the api's: the executor gets no database or keys. The
  # chart sets EXECUTOR_RUN_ROOT and EXECUTOR_SANDBOX_STATE itself.
  existingSecret: ""
  replicas: 1
  # Every sandbox's memory is counted in this pod, so memory must be at least
  # EXECUTOR_MAX_SESSIONS times EXECUTOR_SANDBOX_MEMORY plus 512Mi for the
  # executor itself; the default fits the chart's one 1536 MiB session.
  # requests equal limits, so the pod is Guaranteed and never uses more than
  # the node reserved for it. Override requests and limits together: Helm
  # merges maps, so setting only limits.memory keeps the 2Gi request and the
  # pod drops to Burstable.
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 2Gi
  runRoot:
    # Disk for the workspaces of the runs in flight on one executor. The
    # kubelet evicts the pod, and every run on it, when they outgrow it.
    sizeLimit: 8Gi

ingress:
  # The IngressClass to use. Empty means the cluster's default class.
  className: ""
  # Required. The host openplan is served on. The api's public URL is
  # https://<host>, so it must match the redirect URL registered with the
  # OIDC provider.
  host: ""
  # Required. An existing kubernetes.io/tls Secret for the host. Production
  # mode refuses plain HTTP, so there is no Ingress without TLS.
  tlsSecretName: ""
