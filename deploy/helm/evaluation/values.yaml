# EVALUATION ONLY. Values for installing the chart against setup.sh's
# dependencies on Docker Desktop:
#
#   helm install openplan deploy/helm/openplan -n openplan -f deploy/helm/evaluation/values.yaml
#
# Every host and Secret here is something setup.sh or dependencies.yaml
# creates. A credential the dependencies read too comes from
# evaluation-dependencies, where they read it; the rest, setup.sh puts in
# openplan-credentials. Nothing in this file is
# a chart default or adds a key to the chart.

# A checkout's chart carries the placeholder version 0.0.0-dev, which has no
# images, so the evaluation runs main's. main moves, and Docker Desktop keeps
# every image it pulled: without Always, a reinstall runs whichever main it
# pulled first, which can be older than the chart in the checkout.
image:
  tag: main
  pullPolicy: Always

temporal:
  address: temporal:7233

postgres:
  urlSecret: {name: openplan-credentials, key: database-url}

valkey:
  api:
    urlSecret: {name: openplan-credentials, key: valkey-api-url}
  executor:
    urlSecret: {name: openplan-credentials, key: valkey-executor-url}

s3:
  bucket: openplan-artifacts
  region: us-east-1
  endpoint: http://minio:9000
  forcePathStyle: true
  # MinIO's root user and password.
  accessKeyIDSecret: {name: evaluation-dependencies, key: minio-root-user}
  secretAccessKeySecret: {name: evaluation-dependencies, key: minio-root-password}

oidc:
  issuerURL: https://dex.localhost/dex
  clientID: openplan-api
  clientSecretSecret: {name: evaluation-dependencies, key: oidc-client-secret}

api:
  # The sub Dex issues for admin@openplan.local, from the userID in
  # dependencies.yaml and the "local" connector; the compose value.
  rootSubject: CiQ3YzRiMmYwZS0zZDFhLTRlOGItOWY2Yy0yYTVkOGUxYjBjNDcSBWxvY2Fs
  sessionEncryptionKeySecret: {name: openplan-credentials, key: session-encryption-key}
  credentialEncryptionKeySecret: {name: openplan-credentials, key: credential-encryption-key}
  # Dex is served with the evaluation CA's certificate.
  trustedCASecret: openplan-trusted-ca

ingress:
  className: traefik
  host: openplan.localhost
  tlsSecretName: openplan-tls
