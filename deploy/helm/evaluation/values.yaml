# EVALUATION ONLY. Values for installing the chart against setup.sh's
# dependencies on Docker Desktop:
#
#   helm install openplan deploy/helm/openplan -n openplan -f deploy/helm/evaluation/values.yaml
#
# Every name here is something setup.sh creates. Nothing in this file is a
# chart default or adds a key to the chart.

api:
  existingSecret: openplan-api-env
  # Dex is served with the evaluation CA's certificate.
  trustedCASecret: openplan-trusted-ca

executor:
  existingSecret: openplan-executor-env
  # setup.sh sets EXECUTOR_MAX_SESSIONS=2 at the default 2048 MiB a sandbox:
  # 4 GiB of runs plus 1 GiB for the executor itself. Docker Desktop's VM has
  # about 8 GiB.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 5Gi

ingress:
  className: nginx
  host: openplan.localhost
  tlsSecretName: openplan-tls
