# Publish the openplan images to GHCR.
#
# Without this, `docker compose up` builds every image from source on a
# stranger's machine, which takes minutes and is the first thing that makes
# someone give up before they see the product. With it, the default path is a
# pull of a few tens of megabytes.
#
# Tags are release-driven, deliberately:
#
#   release published -> 0.1.0, v0.1.0, v0.1, v0, latest
#   main push         -> main and the commit SHA, never latest
#
# A `main` build is not something to pin to. It exists so a clone of main has
# something to pull, and so a bug on main is reproducible against an exact
# commit. Anything worth depending on gets a semver tag from a release, and
# `latest` follows releases, so the unpinned path means "latest release" rather
# than "whatever main did this morning".
#
# Each architecture is built on a runner that runs it natively, and the two
# results are merged into one multi-arch tag.
#
# Building both architectures in one `platforms:` list on a single x86 runner
# looks simpler and cost 33 minutes. The api image's Go compile alone took 154s
# for amd64 and 1542s for arm64 in the same run: QEMU translates every arm64
# instruction, and Go compilation is close to the worst case for that. One
# native arm64 build replaces a 25-minute emulated one.
#
# It has to be split this way rather than until x86 catches up, because
# `ubuntu-latest` is arm64 on newer runner images. Whichever leg ends up on the
# "wrong" architecture pays the emulation tax, so each architecture gets a
# runner that matches it.
#
# The merge is the part that is easy to get wrong, and the reason the real tags
# are written by a separate job rather than by the builds. Each build pushes its
# architecture under a per-architecture staging tag; had they pushed to the real
# tag in parallel, whichever finished last would overwrite the other's manifest
# and leave the tag single-architecture. An arm64 host would then pull the amd64
# image and run it under emulation, or fail outright, which is the slow path
# this workflow exists to remove. So the builds only ever write staging tags,
# and the merge job publishes the real ones and then verifies them.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Lets a release be re-published after a packaging fix, without a new commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR is flat: the image path is the repository lowercased, with a slash
  # between namespace and image. `ghcr.io/openplanhq/openplan-api`, not a
  # nested path and not uppercase.
  OWNER: openplanhq
  API_IMAGE: ghcr.io/openplanhq/openplan-api
  EXECUTOR_IMAGE: ghcr.io/openplanhq/openplan-executor
  WEB_IMAGE: ghcr.io/openplanhq/openplan-web

permissions:
  contents: read
  # The token every step authenticates with. GITHUB_TOKEN is scoped to this
  # repository and this run, which is why there is nothing to configure: no PAT,
  # no stored secret, and nothing to revoke later.
  packages: write

jobs:
  # The tag list is derived once so the build and merge jobs cannot disagree
  # about it. Recomputing it per job would mean two implementations of one rule,
  # and a silent skew between the halves of a manifest when they differ.
  plan:
    name: derive tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: derive tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          fi

          # A manual run is typed by a human, who may write `v0.3.0` or
          # `0.3.0`. Normalise once, here, rather than emitting both forms and
          # a `vv0.3.0` for the second.
          version="${version#v}"

          # Validate the shape before anything is published. An unvalidated
          # version reaches the registry as a real tag name, and `v0.2` or
          # `release-2` publishes something nobody can reason about afterwards.
          if [ -n "$version" ] && ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi

          if [ -z "$version" ]; then
            # A main build: commit-identified, and never latest. See the header.
            tags="main,sha-$GITHUB_SHA"
            echo "Publishing main build $GITHUB_SHA as $tags"
          else
            # A release: the exact version both bare and v-prefixed (Compose
            # accepts either, and people paste both), the moving minor and major
            # tags, and latest.
            major="$(echo "$version" | cut -d. -f1)"
            minor="$(echo "$version" | cut -d. -f1,2)"
            tags="$version,v$version,v$minor,v$major,latest"
            echo "Publishing release $version as $tags"
          fi

          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  # Builds one architecture and pushes it under staging tags that record the
  # architecture: `0.1.0-amd64`, `0.1.0-arm64`. The real tags are only ever
  # written by the merge job, so an interrupted run cannot leave a published tag
  # pointing at a single architecture.
  build:
    name: build ${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            # A native ARM64 runner: 4 vCPU, free on public repositories. This
            # label is the whole reason the arm64 build takes minutes rather than
            # half an hour.
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      # The executor image bakes in a specific OpenTofu release and the api and
      # web images build with the Go and Node versions their Dockerfiles pin, so
      # nothing here depends on the runner's own toolchain. No QEMU: each runner
      # builds only its own architecture, natively.
      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Expand the comma-separated tag list into the newline-separated
      # `name:tag` lines the build action parses, each carrying the staging
      # suffix.
      #
      # This has to happen in a shell step. A multi-line step output cannot be
      # interpolated into another string, and a single-line one is read as a
      # single tag: buildx took `ghcr.io/...-api:0.1.0` and read `v0.1.0` as the
      # repository name, pushing to Docker Hub's `library/` namespace for a 401
      # about insufficient scopes. The symptom pointed at credentials and the
      # cause was a separator.
      - name: build staging tag lists
        id: taglists
        env:
          TAG_LIST: ${{ needs.plan.outputs.tags }}
          ARCH: ${{ matrix.arch }}
          API_IMAGE: ${{ env.API_IMAGE }}
          EXECUTOR_IMAGE: ${{ env.EXECUTOR_IMAGE }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
        run: |
          set -euo pipefail
          expand() {
            image=$1
            echo "<<EOF"
            echo "$TAG_LIST" | tr ',' '\n' | while read -r t; do
              [ -n "$t" ] && echo "$image:$t-$ARCH"
            done
          }
          {
            echo "api<<EOF"; expand "$API_IMAGE"; echo "EOF"
            echo "executor<<EOF"; expand "$EXECUTOR_IMAGE"; echo "EOF"
            echo "web<<EOF"; expand "$WEB_IMAGE"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          platforms: ${{ matrix.platform }}
          provenance: false
          push: true
          tags: ${{ steps.taglists.outputs.api }}
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,scope=api-${{ matrix.arch }},mode=max

      - name: push executor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.executor
          platforms: ${{ matrix.platform }}
          provenance: false
          push: true
          tags: ${{ steps.taglists.outputs.executor }}
          cache-from: type=gha,scope=executor-${{ matrix.arch }}
          cache-to: type=gha,scope=executor-${{ matrix.arch }},mode=max

      - name: push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          platforms: ${{ matrix.platform }}
          provenance: false
          push: true
          tags: ${{ steps.taglists.outputs.web }}
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,scope=web-${{ matrix.arch }},mode=max

  # Combines the staging manifests into the real tags. Separate from the builds
  # because the merge has to happen after both of them, and because a merge that
  # half-succeeded should not be reported as a green build.
  merge:
    name: merge architectures
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each source is the staging tag, never the destination, so a concurrent
      # republish of the same version cannot make this read the wrong bytes and
      # the real tag is written exactly once per image.
      - name: merge staging tags into the real tags
        env:
          TAG_LIST: ${{ needs.plan.outputs.tags }}
          API_IMAGE: ${{ env.API_IMAGE }}
          EXECUTOR_IMAGE: ${{ env.EXECUTOR_IMAGE }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
        run: |
          set -euo pipefail
          for image in "$API_IMAGE" "$EXECUTOR_IMAGE" "$WEB_IMAGE"; do
            while read -r t; do
              [ -n "$t" ] || continue
              echo "Merging $image:$t-amd64 and $image:$t-arm64 into $image:$t"
              # Runs in this shell, so `set -e` sees a failure directly.
              docker buildx imagetools create \
                --tag "$image:$t" \
                "$image:$t-amd64" \
                "$image:$t-arm64"
            done < <(echo "$TAG_LIST" | tr ',' '\n')
          done

      # A tag missing an architecture still pulls. It just hands the wrong one
      # to the host, which then emulates it: the exact slowness this workflow
      # exists to remove, and on an arm64 host a hard failure. So the run fails
      # rather than passing on a tag that only works for whoever happens to match
      # whichever architecture finished last.
      - name: verify every published tag is multi-architecture
        env:
          TAG_LIST: ${{ needs.plan.outputs.tags }}
          API_IMAGE: ${{ env.API_IMAGE }}
          EXECUTOR_IMAGE: ${{ env.EXECUTOR_IMAGE }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
        run: |
          set -euo pipefail
          # A here-string rather than `echo | tr | while`. Both forms propagate
          # a failure -- `exit 1` in a pipeline subshell becomes the pipeline's
          # status, which `set -e` acts on -- so this is readability, not a fix.
          for image in "$API_IMAGE" "$EXECUTOR_IMAGE" "$WEB_IMAGE"; do
            while read -r t; do
              [ -n "$t" ] || continue
              # The human-readable output, not --raw. In the raw JSON a platform
              # is {"architecture":"amd64","os":"linux"}, so the literal string
              # `linux/amd64` never appears and grepping for it fails on a
              # perfectly good multi-arch manifest. The rendered form prints a
              # `Platform: linux/amd64` line per manifest, which is what this
              # check needs to match on.
              out="$(docker buildx imagetools inspect "$image:$t")"
              for arch in linux/amd64 linux/arm64; do
                if ! echo "$out" | grep -q "$arch"; then
                  echo "::error::$image:$t has no $arch manifest"
                  echo "$out"
                  exit 1
                fi
              done
              echo "$image:$t is multi-arch"
            done < <(echo "$TAG_LIST" | tr ',' '\n')
          done
