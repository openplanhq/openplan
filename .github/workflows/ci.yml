# CI for openplan. One job per thing a contributor is asked to run: the Go
# build from the repository root, the executor's isolation test, the frontend
# checks from web/, the website build from site/, the Helm chart under
# deploy/helm/openplan, and the lint and vulnerability scan the Makefile pins.
#
# The backend job runs against a real Postgres, so every test gated on
# OPENPLAN_POSTGRES_TEST_DSN runs here, the authorization differential test
# among them. That test also keeps a workflow of its own, differential.yml: it
# is the only guard on internal/authorization/write.go, and there its result
# cannot be crowded out by an unrelated failure.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. A new push to a PR supersedes the run still testing the
# commit it replaced, so nobody waits on an answer to a question they already
# changed. main is never cancelled: its result is the record of what shipped.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend (go build, vet, test)
    runs-on: ubuntu-latest

    # The same service differential.yml runs. Without it the Postgres-backed
    # tests in internal/postgres, internal/migrationlock and cmd/api skip, and
    # a skipped guard is no guard.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway credentials; a CI service database is never anything else.
          POSTGRES_USER: openplan
          POSTGRES_PASSWORD: openplan
          POSTGRES_DB: openplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openplan -d openplan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod is the source of truth: it pins `go 1.26.0` and a toolchain
          # line, so the workflow tracks the bump instead of drifting from it.
          go-version-file: go.mod
          cache: false

      # setup-go's own module cache lives under a fixed runner path that it
      # keys on go.sum; this one is keyed the same way but is shared with the
      # lint job, which builds golangci-lint against the same module graph.
      - name: cache go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Packages test in parallel against the one database. Each internal/postgres
      # test migrates a schema of its own, and the migrations that share the
      # public schema (cmd/api's and internal/authorization's) take the
      # migration lock, so they do not race.
      - name: test
        env:
          OPENPLAN_POSTGRES_TEST_DSN: postgres://openplan:openplan@localhost:5432/openplan_test?sslmode=disable
        run: go test ./...

  sandbox:
    name: "sandbox (executor image, #245)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs runsc as root in the real executor image with the compose
      # security settings: what go test ./... on the runner cannot check.
      - name: sandbox tests
        run: make sandbox-test

  web:
    name: web (test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22, matching Dockerfile.web's `node:22-alpine3.21` build stage.
          # web/package.json declares no engines field, so the Dockerfile is the
          # only place the version is written down.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: test
        run: npm test

      # `tsc -b` runs inside this, so a type error fails the build rather than
      # shipping.
      - name: build
        run: npm run build

  site:
    name: site (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The same Node as the web job.
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: install
        run: npm ci

      - name: build
        run: npm run build

  helm:
    name: helm (lint, template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The exact Helm release, so a new Helm cannot change whether the chart
      # lints without a commit here saying so.
      - uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      # ci/values.yaml fills the required values with placeholders; without
      # them the templates that need them cannot render.
      - name: lint
        run: helm lint --strict deploy/helm/openplan -f deploy/helm/openplan/ci/values.yaml

      - name: template
        run: helm template openplan deploy/helm/openplan -f deploy/helm/openplan/ci/values.yaml

      # An install missing a required value must stop at template time and name
      # the key, not render a Deployment that crash-loops. Helm's lint only
      # warns about a missing required value, so this checks it through
      # template, one key at a time.
      - name: template fails without each required value
        run: |
          # Each Secret reference is required twice over: its name and its key.
          refs="postgres.passwordSecret valkey.api.passwordSecret valkey.executor.passwordSecret s3.accessKeyIDSecret s3.secretAccessKeySecret oidc.clientSecretSecret api.sessionEncryptionKeySecret api.credentialEncryptionKeySecret"
          keys="temporal.address postgres.url valkey.api.url valkey.executor.url s3.bucket s3.region oidc.issuerURL oidc.clientID api.rootSubject ingress.host ingress.tlsSecretName"
          for ref in $refs; do keys="$keys $ref.name $ref.key"; done
          for key in $keys; do
            if out=$(helm template openplan deploy/helm/openplan -f deploy/helm/openplan/ci/values.yaml --set "$key=" 2>&1); then
              echo "::error::helm template succeeded with $key empty"
              exit 1
            fi
            if ! grep -qF "$key is required" <<<"$out"; then
              echo "::error::helm template failed with $key empty but did not name it:"
              echo "$out"
              exit 1
            fi
          done

  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: cache go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Runs through `go run` rather than golangci/golangci-lint-action, which
      # is the one place this workflow departs from the usual setup.
      #
      # The action resolves the latest *patch* release for whatever minor
      # version you name, so it cannot express this pin exactly: `version: v2.14`
      # would silently track the newest v2.14.x while the Makefile runs v2.14.0.
      # CI and `make lint` must not be able to disagree about whether a change
      # lints, so the workflow runs the Makefile's exact command and nothing
      # else. Config is .golangci.yml (version "2"), hence the /v2 path.
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...

  vulncheck:
    name: vulncheck (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain go.mod pins is the standard library that ships, so it is
      # the one to scan: most of what govulncheck finds is in the standard
      # library, fixed by a toolchain bump.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: cache go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # The Makefile's exact command, pinned the same way as golangci-lint.
      # It fails only on vulnerabilities in code this module calls, not on
      # everything in its dependency graph, so a red run is one to act on. A
      # vulnerability published tomorrow turns this red on a branch that
      # changed nothing; that is the point, not noise.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
