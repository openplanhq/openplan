# Deploys site/ to GitHub Pages, served at https://openplan.run (site/public/CNAME).
# CI's `site` job tests every PR; this one publishes what lands on main.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # The site imports the app's theme, so a theme change redeploys it.
      - "web/src/styles/theme.css"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: install
        run: npm ci

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
