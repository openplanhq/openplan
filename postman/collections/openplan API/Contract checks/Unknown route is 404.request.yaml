$kind: http-request
method: GET
url: '{{base_url}}/v1/does-not-exist'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404));
      pm.test('error code is not_found', () => pm.expect(pm.response.json().error).to.eql('not_found'));
    language: text/javascript
order: 1000
