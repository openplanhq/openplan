$kind: http-request
method: POST
url: '{{base_url}}/v1/tenants/{{tenant_id}}/stacks'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{ "name": '
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 400', () => pm.response.to.have.status(400));
      pm.test('is a problem document', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json'));
      pm.test('type is https://openplan.run/problems/malformed-body', () => pm.expect(pm.response.json().type).to.eql('https://openplan.run/problems/malformed-body'));
    language: text/javascript
order: 6000
