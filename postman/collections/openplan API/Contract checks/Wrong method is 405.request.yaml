$kind: http-request
method: DELETE
url: '{{base_url}}/healthz'
scripts:
  - type: beforeRequest
    code: |-
      // Sent without a session, as a browser reaches this route.
      pm.request.headers.remove('Cookie');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('status is 405', () => pm.response.to.have.status(405));
      pm.test('error code is method_not_allowed', () => pm.expect(pm.response.json().error).to.eql('method_not_allowed'));
      pm.test('Allow names GET', () => pm.expect(pm.response.headers.get('Allow')).to.include('GET'));
    language: text/javascript
order: 2000
