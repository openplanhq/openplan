$kind: http-request
method: GET
url: '{{base_url}}/v1/me'
scripts:
  - type: beforeRequest
    code: |-
      // Sent without a session, as a browser reaches this route.
      pm.request.headers.remove('Cookie');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('status is 401', () => pm.response.to.have.status(401));
      pm.test('is a problem document', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json'));
      pm.test('type is about:blank', () => pm.expect(pm.response.json().type).to.eql('about:blank'));
    language: text/javascript
order: 4000
