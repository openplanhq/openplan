$kind: http-request
method: GET
url: '{{base_url}}/v1/tenants/{{tenant_id}}/users/search'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 400', () => pm.response.to.have.status(400));
      pm.test('error code is invalid_request', () => pm.expect(pm.response.json().error).to.eql('invalid_request'));
    language: text/javascript
order: 8000
