$kind: http-request
method: PUT
url: '{{base_url}}/v1/tenants/{{tenant_id}}/stack-templates/{{stack_template_id}}/config'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 422', () => pm.response.to.have.status(422));
      pm.test('is a problem document', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json'));
      pm.test('type is https://openplan.run/problems/validation-failed', () => pm.expect(pm.response.json().type).to.eql('https://openplan.run/problems/validation-failed'));
      pm.test('first error is on #/config', () => pm.expect(pm.response.json().errors[0].pointer).to.eql('#/config'));
    language: text/javascript
order: 11000
