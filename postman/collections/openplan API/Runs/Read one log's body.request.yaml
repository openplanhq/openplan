$kind: http-request
description: |-
  Returns the raw Terraform output as `text/plain`, not JSON. Only a
  log whose `state` is `complete` has a body: a `live` one returns
  `409 log-live`, a `lost` one `404 log-lost`. A log that has not
  started yet, or a name that isn't a log name, returns `404`.
method: GET
url: '{{base_url}}/v1/tenants/{{tenant_id}}/template-runs/{{run_id}}/logs/{{name}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('body is plain text', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/plain'));
    language: text/javascript
order: 6000
