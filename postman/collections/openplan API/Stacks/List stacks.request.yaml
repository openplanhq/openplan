$kind: http-request
description: |-
  Only the stacks the caller may view. Each carries its
  `effective_capabilities`, so a client renders the controls a person
  actually has rather than probing for them.
method: GET
url: '{{base_url}}/v1/tenants/{{tenant_id}}/stacks'
scripts:
  - type: afterResponse
    code: pm.test('status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
