$kind: http-request
description: |-
  Synchronous. The stack row, the audit event and the authorization edges
  that make the stack reachable are written in one transaction, so a
  `201` response describes a stack that is already usable and a failure
  leaves no stack behind. There is nothing to poll.
method: POST
url: '{{base_url}}/v1/tenants/{{tenant_id}}/stacks'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman {{$timestamp}}",
      "tags": { "team": "platform" },
      "default_credential_ids": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      if (pm.response.code < 300) { pm.environment.set('stack_id', pm.response.json().id); }
    language: text/javascript
order: 1000
