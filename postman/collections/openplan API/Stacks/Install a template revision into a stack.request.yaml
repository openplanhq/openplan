$kind: http-request
description: |-
  `config` is validated against the revision's variables, so register the
  revision and read its variables first.

  The config is empty, which suits a template whose variables all have defaults, as the demo template does. Fill it in for one that has required variables.
method: POST
url: '{{base_url}}/v1/tenants/{{tenant_id}}/stacks/{{stack_id}}/templates'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "template_revision_id": "{{template_revision_id}}",
      "component_key": "postman-{{$timestamp}}",
      "config": {}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      if (pm.response.code < 300) { pm.environment.set('stack_template_id', pm.response.json().id); }
    language: text/javascript
order: 5000
