$kind: http-request
description: |-
  Replaces the desired config wholesale — this is not a field-level
  merge. The new config is validated against the desired revision's
  variables.

  Refused with `409 run-in-flight` while the installed template has an unfinished
  run, a plan waiting for approval included: a run snapshots the config
  when it starts, and the plan being reviewed has to stay a plan of what
  the installed template says. Apply or discard the run first.
method: PUT
url: '{{base_url}}/v1/tenants/{{tenant_id}}/stack-templates/{{stack_template_id}}/config'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{ "config": {} }'
scripts:
  - type: afterResponse
    code: pm.test('status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
