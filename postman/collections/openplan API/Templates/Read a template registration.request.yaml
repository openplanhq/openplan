$kind: http-request
description: |-
  Poll this after `POST /v1/tenants/{tenant_id}/template-revisions`.

  In a collection run this re-sends itself until the registration ends, and saves its revision.
method: GET
url: '{{base_url}}/v1/tenants/{{tenant_id}}/template-registrations/{{registration_id}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const registration = pm.response.json();
      if (registration.template_revision_id) { pm.environment.set('template_revision_id', registration.template_revision_id); }
      const tries = Number(pm.environment.get('poll_tries') || 0);
      if (!(!['pending', 'running'].includes(registration.status)) && tries < 30) {
        pm.environment.set('poll_tries', String(tries + 1));
        setTimeout(() => {}, 2000);
        pm.execution.setNextRequest(pm.info.requestName);
      } else {
        pm.environment.unset('poll_tries');
      }
    language: text/javascript
order: 3000
