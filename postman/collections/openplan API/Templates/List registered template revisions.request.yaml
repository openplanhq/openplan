$kind: http-request
description: Newest first, a page at a time.
method: GET
url: '{{base_url}}/v1/tenants/{{tenant_id}}/template-revisions?limit=50'
queryParams:
  - key: limit
    value: "50"
    description: |-
      At most how many items the page holds. Out of range is a `422`; not an
      integer, a `400` (`invalid-query`).
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const revisions = pm.response.json().items;
      if (!pm.environment.get('template_revision_id') && revisions.length) { pm.environment.set('template_revision_id', revisions[0].id); }
    language: text/javascript
order: 2000
