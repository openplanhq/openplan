$kind: http-request
description: |-
  Newest first, a page at a time. A template shows from the moment it is
  registered, before any sync has recorded a revision of it.
method: GET
url: '{{base_url}}/v1/tenants/{{tenant_id}}/templates?limit=50'
queryParams:
  - key: limit
    value: "50"
    description: |-
      At most how many items the page holds. Out of range is a `422`; not an
      integer, a `400` (`invalid-query`).
scripts:
  - type: afterResponse
    code: pm.test('status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
