$kind: http-request
description: |-
  Credentials are write-only. The value is encrypted on the way in and is
  never readable back through the API — it is injected into the process
  environment only while Terraform runs. To change one, delete it and
  create it again.

  `name` is the provider environment variable name, such as
  `AWS_SECRET_ACCESS_KEY`.
method: POST
url: '{{base_url}}/v1/tenants/{{tenant_id}}/stacks/{{stack_id}}/credentials'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{ "name": "TF_VAR_postman_{{$timestamp}}", "value": "example-secret" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      if (pm.response.code < 300) { pm.environment.set('credential_id', pm.response.json().id); }
    language: text/javascript
order: 1000
