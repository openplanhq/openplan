$kind: http-request
description: |-
  The value is encrypted on the way in and injected into the process
  environment only while Terraform runs. A credential is sensitive unless
  the request sets `sensitive` to `false`: a sensitive value is never
  readable back through the API, and one that is not sensitive comes back
  on this response and on every list. Sensitivity is set on create and
  can't change. To change a value, delete it and create it again.

  `name` is the provider environment variable name, such as
  `AWS_SECRET_ACCESS_KEY`.
method: POST
url: '{{base_url}}/v1/tenants/{{tenant_id}}/stacks/{{stack_id}}/credentials'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{ "name": "TF_VAR_postman_{{$timestamp}}", "value": "example-secret" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      if (pm.response.code < 300) { pm.environment.set('credential_id', pm.response.json().id); }
    language: text/javascript
order: 1000
