$kind: http-request
description: |-
  Same contract as a stack credential, sensitivity included, scoped to
  one installed template. Use this to override a stack-wide credential
  for a single installed template; the override's own `sensitive` decides whether
  its value is shown.
method: POST
url: '{{base_url}}/v1/tenants/{{tenant_id}}/stack-templates/{{stack_template_id}}/credentials'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{ "name": "TF_VAR_postman_{{$timestamp}}", "value": "example-secret" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      if (pm.response.code < 300) { pm.environment.set('credential_id', pm.response.json().id); }
    language: text/javascript
order: 4000
