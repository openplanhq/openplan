$kind: http-request
description: |-
  Metadata for every credential, and the value of each one that is not
  sensitive. Sensitive values are never returned.
method: GET
url: '{{base_url}}/v1/tenants/{{tenant_id}}/stack-templates/{{stack_template_id}}/credentials'
scripts:
  - type: afterResponse
    code: pm.test('status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
